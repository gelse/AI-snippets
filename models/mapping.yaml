model-mapping:
  model-list:
    - name: "DeepSeek V4 Pro"
      id: "deepseek-v4-pro"
    - name: "DeepSeek V4 Flash"
      id: "deepseek-v4-flash"
    - name: "GLM 5.3 Flash"
      id: "glm-5.3-flash"
    - name: "MiMo v2.6 Flash"
      id: "mimo-v2.6-flash"
    - name: "MiMo v2.6 Pro"
      id: "mimo-v2.6-pro"
    - name: "Minimax M3"
      id: "minimax-m3"
    - name: "Muse Spark 1.3 Contributor"
      id: "muse-spark-1.3-contributor"
    - name: "Qwen 3.8 Flash"
      id: "qwen3.8-flash"
    - name: "Qwen 3.8 - Hetzner Experimental"
      id: "Qwen3.8-27B"
    - name: "Qwen3 - local embedding"
      id: "qwen3-embedding:4b"
  agent-mapping:
    - agent: architect
      model: Qwen3.8-27B
    - agent: ask
      model: glm-5.3-flash
      fallbacks:
        - mimo-v2.6-flash
    - agent: captain
      model: minimax-m3
      fallbacks:
        - deepseek-v4-pro
    - agent: code
      model: glm-5.3-flash
      fallbacks:
        - mimo-v2.6-flash
    - agent: debug
      model: Qwen3.8-27B
    - agent: investigator
      model: glm-5.3-flash
      fallbacks:
        - Qwen3.8-27B
    - agent: lieutenant
      model: mimo-v2.6-pro
      fallbacks:
        - minimax-m3
    # deprecated: replaced by 'lieutenant' — kept for documentation consistency with modes.json
    - agent: orchestrator
      model: mimo-v2.6-pro
      fallbacks:
        - minimax-m3
    - agent: plan
      model: minimax-m3
      fallbacks:
        - glm-5.3-flash
    - agent: review-code
      model: deepseek-v4-flash
      fallbacks:
        - qwen3.8-flash
        - muse-spark-1.3-contributor
    - agent: review-plan
      model: mimo-v2.6-pro
      fallbacks:
        - deepseek-v4-pro
        - muse-spark-1.3-contributor
    - agent: security-review
      model: minimax-m3
      fallbacks:
        - deepseek-v4-pro
        - qwen3.8-flash
    - agent: verify
      model: deepseek-v4-flash
      fallbacks:
        - mimo-v2.6-flash